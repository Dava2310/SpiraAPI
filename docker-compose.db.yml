# Solo base de datos PostgreSQL (sin la API).
# Uso: docker compose -f docker-compose.db.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: spira-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spira_secret}
      POSTGRES_DB: ${POSTGRES_DB:-spira_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Host port 5433 to avoid conflict with the local WSL Postgres on 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spira} -d ${POSTGRES_DB:-spira_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
